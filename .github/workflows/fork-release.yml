# Builds unsigned standalone Windows executables (x64 & arm64) and publishes a
# GitHub Release with SHA256SUMS.txt for Scoop (sakiko999/scoop-overlay).
name: Fork Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading 'v' (e.g. 0.6.0.1)
        required: true
        default: "0.6.0.1"
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            toolchain: stable-x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            toolchain: stable-aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fork-release-${{ matrix.arch }}
          cache-on-failure: true
      - name: Build portable executable
        env:
          ARGUS_BUILD_METADATA: ""
        run: node scripts/build.mjs --arch ${{ matrix.arch }}
      - name: Stage artifact
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path staged -Force | Out-Null
          $name = "Argus_${{ inputs.version }}_${{ matrix.arch }}.exe"
          Copy-Item -LiteralPath "target/release/argus.exe" -Destination (Join-Path "staged" $name)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-${{ matrix.arch }}
          path: staged/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download artifacts and compute SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh run download "$GITHUB_RUN_ID" -n fork-release-x64 -D assets
          gh run download "$GITHUB_RUN_ID" -n fork-release-arm64 -D assets
          (cd assets && sha256sum -- *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --target "$GITHUB_SHA" \
              --title "Argus $TAG (memory-cleanup fork)" \
              --notes "Personal fork build of Argus with manual and automatic system memory cleanup (Issue #187)."
          fi
